name: 离线门禁

# 这里只跑「不需要浏览器、不连 ERP」的那部分检查。
# 真正跑用例要桌面 MyTest 浏览器 + 真实登录态，CI 上不具备条件，
# 硬跑出来全是「阻塞」，绿得没有意义。所以：
#   - CI（本文件）：静态门禁，每次 push / PR 必跑，20 秒内出结果
#   - 夜间接口巡检：本机任务计划程序 + tools\nightly_api.cmd（见 README）
#   - UI 层：每周手动跑一次（依赖桌面浏览器，无法无人值守）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # 项目本身是 Windows-only（taskkill、os.startfile、MyTest 浏览器），
    # 用 windows 跑才能和开发机行为一致；Linux 上测绿了不算数
    runs-on: windows-latest
    timeout-minutes: 15

    # 英文 Windows runner 的管道默认码页是 cp1252，打中文直接 UnicodeEncodeError。
    # gate.py / check_boundaries.py 内部已经自己钉 UTF-8，这里再兜一层，
    # 顺带让 pip 和 ruff 的输出也保持可读。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 离线门禁
        run: python tools/gate.py
